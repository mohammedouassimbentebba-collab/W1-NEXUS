[package]
name = "w1-cip-core"
version = "0.1.0"
edition = "2021"
authors = ["W1™ Systems Engineering <mohammedouassim.bentebba@etu.univ-batna2.dz>"]
description = "Deterministic state engine, Merkle-DAG ledger, and O(1) rollback core for W1-CIP."
license = "MPL-2.0"

[lib]
name = "w1_cip_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
blake3 = "1.5"
petgraph = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
