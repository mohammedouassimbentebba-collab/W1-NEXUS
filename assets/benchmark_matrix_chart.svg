<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" width="1100" height="580">
  <defs>
    <linearGradient id="bgTax" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C18"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <linearGradient id="infraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="modelGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
  </defs>

  <style>
    .header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 24px; fill: #F8FAFC; }
    .subheader { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 13px; fill: #94A3B8; }
    .section-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 0.5px; text-transform: uppercase; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; font-weight: 700; font-size: 13px; }
    .item-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 11px; fill: #94A3B8; }
    .footer-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #38BDF8; }
    .footer-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 11px; fill: #CBD5E1; }
  </style>

  <!-- Background -->
  <rect width="1100" height="580" rx="16" fill="url(#bgTax)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header -->
  <text x="50" y="45" class="header">W1™ NEXUS — 12-Class Failure Taxonomy Architecture</text>
  <text x="50" y="70" class="subheader">Objective mathematical separation of upstream infrastructure faults from intrinsic model reasoning defects</text>

  <!-- ================= LEFT COLUMN: INFRASTRUCTURE & TRANSPORT FAULTS ================= -->
  <g transform="translate(50, 95)">
    <!-- Column Container -->
    <rect width="480" height="380" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="480" height="40" rx="12" fill="#0E1E38"/>
    <text x="20" y="26" class="section-title" fill="#38BDF8">Partition I: Extrinsic Infrastructure Faults</text>

    <!-- 1. PROVIDER_TIMEOUT -->
    <g transform="translate(20, 55)">
      <rect width="440" height="46" rx="6" fill="#070D1C" stroke="#0284C7" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#38BDF8"/>
      <text x="35" y="20" class="item-title" fill="#38BDF8">PROVIDER_TIMEOUT</text>
      <text x="35" y="36" class="item-desc">Upstream API gateway, NIM socket, or provider inference queue deadline exceeded</text>
    </g>

    <!-- 2. RATE_LIMIT -->
    <g transform="translate(20, 108)">
      <rect width="440" height="46" rx="6" fill="#070D1C" stroke="#1E293B" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#38BDF8"/>
      <text x="35" y="20" class="item-title" fill="#F1F5F9">RATE_LIMIT</text>
      <text x="35" y="36" class="item-desc">HTTP 429 quota exhaustion, RPM/TPM ceiling, or concurrency throttle</text>
    </g>

    <!-- 3. PROVIDER_ERROR -->
    <g transform="translate(20, 161)">
      <rect width="440" height="46" rx="6" fill="#070D1C" stroke="#1E293B" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#38BDF8"/>
      <text x="35" y="20" class="item-title" fill="#F1F5F9">PROVIDER_ERROR</text>
      <text x="35" y="36" class="item-desc">HTTP 500/502/503/504 Bad Gateway, service outage, or broken upstream socket</text>
    </g>

    <!-- 4. CONTEXT_LIMIT -->
    <g transform="translate(20, 214)">
      <rect width="440" height="46" rx="6" fill="#070D1C" stroke="#1E293B" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#38BDF8"/>
      <text x="35" y="20" class="item-title" fill="#F1F5F9">CONTEXT_LIMIT</text>
      <text x="35" y="36" class="item-desc">Input tokens exceed maximum supported context window of the target model profile</text>
    </g>

    <!-- 5. AUTH_ERROR -->
    <g transform="translate(20, 267)">
      <rect width="440" height="46" rx="6" fill="#070D1C" stroke="#1E293B" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#38BDF8"/>
      <text x="35" y="20" class="item-title" fill="#F1F5F9">AUTH_ERROR</text>
      <text x="35" y="36" class="item-desc">HTTP 401/403 invalid API key, expired token, or unauthorized model entitlement</text>
    </g>

    <!-- 6. ENVIRONMENT_ERROR -->
    <g transform="translate(20, 320)">
      <rect width="440" height="46" rx="6" fill="#070D1C" stroke="#1E293B" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#38BDF8"/>
      <text x="35" y="20" class="item-title" fill="#F1F5F9">ENVIRONMENT_ERROR</text>
      <text x="35" y="36" class="item-desc">Sandbox container failure, missing system tool dependency, or pre-flight host crash</text>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: MODEL REASONING & OUTPUT DEFECTS ================= -->
  <g transform="translate(570, 95)">
    <!-- Column Container -->
    <rect width="480" height="380" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2"/>
    <rect x="0" y="0" width="480" height="40" rx="12" fill="#201035"/>
    <text x="20" y="26" class="section-title" fill="#C084FC">Partition II: Intrinsic Cognitive &amp; Execution Defects</text>

    <!-- 7. WRONG_REASONING -->
    <g transform="translate(20, 55)">
      <rect width="440" height="46" rx="6" fill="#120924" stroke="#7C3AED" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#C084FC"/>
      <text x="35" y="20" class="item-title" fill="#C084FC">WRONG_REASONING</text>
      <text x="35" y="36" class="item-desc">Logical fallacy, incorrect deduction, or assertion failure against ground truth</text>
    </g>

    <!-- 8. MODEL_ERROR -->
    <g transform="translate(20, 108)">
      <rect width="440" height="46" rx="6" fill="#120924" stroke="#1E293B" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#C084FC"/>
      <text x="35" y="20" class="item-title" fill="#F1F5F9">MODEL_ERROR</text>
      <text x="35" y="36" class="item-desc">Contract violation, missing required JSON fields, or output schema non-conformance</text>
    </g>

    <!-- 9. TOOL_ERROR -->
    <g transform="translate(20, 161)">
      <rect width="440" height="46" rx="6" fill="#120924" stroke="#1E293B" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#C084FC"/>
      <text x="35" y="20" class="item-title" fill="#F1F5F9">TOOL_ERROR</text>
      <text x="35" y="36" class="item-desc">Model invokes tool with invalid arguments or triggers runtime process failure</text>
    </g>

    <!-- 10. PARSER_ERROR -->
    <g transform="translate(20, 214)">
      <rect width="440" height="46" rx="6" fill="#120924" stroke="#1E293B" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#C084FC"/>
      <text x="35" y="20" class="item-title" fill="#F1F5F9">PARSER_ERROR</text>
      <text x="35" y="36" class="item-desc">Malformed JSON syntax, unescaped markdown blocks, or corrupted token streams</text>
    </g>

    <!-- 11. TIMEOUT -->
    <g transform="translate(20, 267)">
      <rect width="440" height="46" rx="6" fill="#120924" stroke="#1E293B" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#C084FC"/>
      <text x="35" y="20" class="item-title" fill="#F1F5F9">TIMEOUT (LOCAL)</text>
      <text x="35" y="36" class="item-desc">Local task loop ceiling reached without achieving terminal convergence</text>
    </g>

    <!-- 12. UNKNOWN -->
    <g transform="translate(20, 320)">
      <rect width="440" height="46" rx="6" fill="#120924" stroke="#1E293B" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#C084FC"/>
      <text x="35" y="20" class="item-title" fill="#F1F5F9">UNKNOWN</text>
      <text x="35" y="36" class="item-desc">Unclassified anomaly routed to human-in-the-loop review queue for audit</text>
    </g>
  </g>

  <!-- ================= BOTTOM PANEL: ISOLATION & ROUTING POLICY ================= -->
  <g transform="translate(50, 490)">
    <rect width="1000" height="65" rx="8" fill="#0A1122" stroke="#1E293B" stroke-width="1"/>
    <text x="25" y="25" class="footer-title">NEXUS Governance Guarantee:</text>
    <text x="25" y="45" class="footer-desc">
      Extrinsic faults trigger automatic credential fallback &amp; jittered backoff without penalizing model scores. Intrinsic faults trigger W1-CIP adversarial challenges, evidence logging, and multi-model critique loops.
    </text>
  </g>
</svg>
