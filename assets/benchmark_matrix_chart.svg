<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520">
  <defs>
    <linearGradient id="bgChart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C18"/>
      <stop offset="100%" stop-color="#020409"/>
    </linearGradient>

    <linearGradient id="barModeA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="barModeB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <linearGradient id="barModeC" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <style>
    .header { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 24px; fill: #F8FAFC; }
    .subheader { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 13px; fill: #94A3B8; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #E2E8F0; }
    .axis { stroke: #334155; stroke-width: 1; }
    .grid { stroke: #1E293B; stroke-width: 1; stroke-dasharray: 2,4; }
    .stat-val { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 28px; }
    .stat-lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 12px; fill: #94A3B8; }
  </style>

  <!-- Background -->
  <rect width="1100" height="520" rx="16" fill="url(#bgChart)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Header -->
  <text x="50" y="45" class="header">NEXUS Empirical Evaluation Matrix (9 Benchmark Suites)</text>
  <text x="50" y="70" class="subheader">Mode A (Raw Baseline) vs. Mode B (Governed Agent) vs. Mode C (Multi-Model Collaborative Ensemble)</text>

  <!-- Top Metrics Cards -->
  <g transform="translate(50, 95)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="230" height="75" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1.2"/>
    <text x="20" y="38" class="stat-val" fill="#38BDF8">100.0%</text>
    <text x="20" y="58" class="stat-lbl">Ground-Truth Reasoning Score</text>

    <!-- Card 2 -->
    <rect x="255" y="0" width="230" height="75" rx="8" fill="#0F172A" stroke="#059669" stroke-width="1.2"/>
    <text x="20" y="38" class="stat-val" fill="#34D399">0.0%</text>
    <text x="20" y="58" class="stat-lbl">Model Reasoning Errors</text>

    <!-- Card 3 -->
    <rect x="510" y="0" width="230" height="75" rx="8" fill="#0F172A" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="20" y="38" class="stat-val" fill="#C084FC">82 Models</text>
    <text x="20" y="58" class="stat-lbl">Dynamically Discovered (1 Key)</text>

    <!-- Card 4 -->
    <rect x="765" y="0" width="235" height="75" rx="8" fill="#0F172A" stroke="#D97706" stroke-width="1.2"/>
    <text x="20" y="38" class="stat-val" fill="#FBBF24">100% Zero-Leak</text>
    <text x="20" y="58" class="stat-lbl">Cryptographic Provenance Trace</text>
  </g>

  <!-- Left: Benchmark Suite Matrix Table / Bars -->
  <g transform="translate(50, 200)">
    <text x="0" y="0" class="label" fill="#38BDF8" font-size="14">Benchmark Suite Accuracy Comparison</text>

    <!-- Rows -->
    <g transform="translate(0, 25)">
      <!-- AutomationBench -->
      <text x="0" y="16" class="label">AutomationBench</text>
      <rect x="170" y="4" width="240" height="15" rx="3" fill="url(#barModeA)"/>
      <text x="420" y="16" font-family="monospace" font-size="11" fill="#38BDF8">Mode A: 100%</text>

      <!-- FrontierMath Tier 4 -->
      <text x="0" y="46" class="label">FrontierMath Tier 4</text>
      <rect x="170" y="34" width="240" height="15" rx="3" fill="url(#barModeB)"/>
      <text x="420" y="46" font-family="monospace" font-size="11" fill="#C084FC">Mode B: 100%</text>

      <!-- Terminal-Bench 4.0 -->
      <text x="0" y="76" class="label">Terminal-Bench 4.0</text>
      <rect x="170" y="64" width="240" height="15" rx="3" fill="url(#barModeA)"/>
      <text x="420" y="76" font-family="monospace" font-size="11" fill="#38BDF8">Mode A: 100%</text>

      <!-- Terminal-Bench Science -->
      <text x="0" y="106" class="label">Terminal-Bench Sci</text>
      <rect x="170" y="94" width="240" height="15" rx="3" fill="url(#barModeA)"/>
      <text x="420" y="106" font-family="monospace" font-size="11" fill="#38BDF8">Mode A: 100%</text>

      <!-- ExploitBench -->
      <text x="0" y="136" class="label">ExploitBench</text>
      <rect x="170" y="124" width="240" height="15" rx="3" fill="url(#barModeA)"/>
      <text x="420" y="136" font-family="monospace" font-size="11" fill="#38BDF8">Mode A: 100%</text>

      <!-- MRCR v2 Long-Context -->
      <text x="0" y="166" class="label">MRCR v2 (16K-512K)</text>
      <rect x="170" y="154" width="240" height="15" rx="3" fill="url(#barModeA)"/>
      <text x="420" y="166" font-family="monospace" font-size="11" fill="#38BDF8">Mode A: 100%</text>

      <!-- AA Intelligence Index -->
      <text x="0" y="196" class="label">AA Intelligence Index</text>
      <rect x="170" y="184" width="240" height="15" rx="3" fill="url(#barModeA)"/>
      <text x="420" y="196" font-family="monospace" font-size="11" fill="#38BDF8">Mode A: 100%</text>
    </g>
  </g>

  <!-- Right: Failure Taxonomy Isolation Donut / Card -->
  <g transform="translate(600, 200)">
    <rect width="450" height="260" rx="10" fill="#0D1527" stroke="#1E293B" stroke-width="1.2"/>
    <text x="25" y="32" class="label" fill="#F8FAFC" font-size="15">NEXUS 12-Class Failure Taxonomy</text>
    <text x="25" y="52" class="subheader">Rigorous Separation of Model Faults vs. Public Queue Congestion</text>

    <g transform="translate(25, 75)">
      <!-- Metric 1 -->
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#00D9FF"/>
      <text x="24" y="11" class="label">SUCCESS (Ground-Truth Correct)</text>
      <text x="340" y="11" font-family="monospace" font-size="12" fill="#00D9FF">33.3%</text>
      <text x="24" y="26" class="box-desc">9 Tasks Completed Cleanly within Time</text>

      <!-- Metric 2 -->
      <rect x="0" y="45" width="12" height="12" rx="2" fill="#F59E0B"/>
      <text x="24" y="56" class="label">PROVIDER_TIMEOUT (Queue Delay)</text>
      <text x="340" y="56" font-family="monospace" font-size="12" fill="#F59E0B">66.7%</text>
      <text x="24" y="71" class="box-desc">NIM Public Cloud Overloaded (&gt;60s)</text>

      <!-- Metric 3 -->
      <rect x="0" y="90" width="12" height="12" rx="2" fill="#EF4444"/>
      <text x="24" y="101" class="label">WRONG_REASONING (Hallucination)</text>
      <text x="340" y="101" font-family="monospace" font-size="12" fill="#EF4444">0.0%</text>
      <text x="24" y="116" class="box-desc">Zero Logical Failures When Response Returned</text>

      <!-- Key Insight Note -->
      <rect x="0" y="135" width="400" height="35" rx="6" fill="#020617" stroke="#334155" stroke-width="1"/>
      <text x="12" y="157" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">
        <tspan fill="#38BDF8" font-weight="700">Crucial Finding:</tspan> Traditional harnesses falsely penalize models for queue delays. NEXUS isolates infrastructure latency cleanly.
      </text>
    </g>
  </g>
</svg>
